name: Android and iOS CI

on:
  pull_request:
    branches:
      - master
      - "feature/**"
      - "chore/**"
      - "fix/**"
      - "test/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android debug
        run: ./gradlew :app:android:assembleDebug --build-cache --parallel --stacktrace --warning-mode all

      - name: Build Android release
        run: ./gradlew :app:android:assembleRelease --build-cache --parallel --stacktrace --warning-mode all

      - name: Build Android release bundle
        run: ./gradlew :app:android:bundleRelease --build-cache --parallel --stacktrace --warning-mode all

      - name: Test backup encryption
        run: ./gradlew :shared:data-backup:testDebugUnitTest --build-cache --parallel --stacktrace --warning-mode all

      - name: Test local summarizer
        run: ./gradlew :shared:data-summary:testDebugUnitTest --build-cache --parallel --stacktrace --warning-mode all

      - name: Audit release readiness
        run: ./gradlew checkReleaseReadiness --build-cache --parallel --stacktrace --warning-mode all

      - name: Compile shared metadata
        run: >
          ./gradlew
          :shared:core-model:compileKotlinMetadata
          :shared:core-util:compileKotlinMetadata
          :shared:core-designsystem:compileKotlinMetadata
          :shared:domain-diary:compileKotlinMetadata
          :shared:domain-auth:compileKotlinMetadata
          :shared:domain-summary:compileKotlinMetadata
          :shared:domain-backup:compileKotlinMetadata
          :shared:data-diary:compileKotlinMetadata
          :shared:data-auth:compileKotlinMetadata
          :shared:data-summary:compileKotlinMetadata
          :shared:data-backup:compileKotlinMetadata
          :shared:feature-entry:compileKotlinMetadata
          :shared:feature-summary:compileKotlinMetadata
          :shared:feature-backup:compileKotlinMetadata
          --build-cache
          --parallel
          --stacktrace
          --warning-mode
          all

  ios:
    name: iOS KMP
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile iOS simulator framework
        run: ./gradlew :app:ios:compileKotlinIosSimulatorArm64 --build-cache --parallel --stacktrace --warning-mode all

      - name: Build iOS SwiftUI shell
        run: >
          xcodebuild
          -project app/iosApp/SumDiary.xcodeproj
          -scheme SumDiary
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
